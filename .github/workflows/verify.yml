name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: algani_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pintegration-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: node tests/integration.cjs
        env:
          TEST_MYSQL_URL: mysql://root:integration-only-password@127.0.0.1:3306/algani_test
