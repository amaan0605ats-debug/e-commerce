name: Encrypted backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - name: Export encrypted database snapshot
        run: node backend/scripts/backup.cjs backup algani-backup.enc
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup
          path: algani-backup.enc
          retention-days: 7
