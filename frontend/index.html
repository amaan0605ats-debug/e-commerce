  <!-- Preloader Styles (inline to avoid FOUC) -->
  <style>
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #1E0E05;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .preloader-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .preloader-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      font-weight: 700;
      color: #FBF3E3;
      letter-spacing: 3px;
    }
    .preloader-logo span { color: #C8922A; }
    .preloader-bar {
      width: 120px;
      height: 3px;
      background: rgba(200,146,42,0.2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .preloader-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #C8922A, #E0B050, transparent);
      animation: preloaderShimmer 1s ease-in-out infinite;
    }
    @keyframes preloaderShimmer {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .preloader-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C8922A;
    }
  </style>
</head>
