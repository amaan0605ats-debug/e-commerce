<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E3"/>
      <stop offset="30%" stop-color="#E0B050"/>
      <stop offset="70%" stop-color="#C8922A"/>
      <stop offset="100%" stop-color="#A57018"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1508"/>
      <stop offset="100%" stop-color="#140702"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C8922A" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rich Dark Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="url(#goldGradient)" stroke-width="12" opacity="0.85"/>
  
  <!-- Inner Subtle Border -->
  <rect x="44" y="44" width="424" height="424" rx="60" fill="none" stroke="#E0B050" stroke-width="2" opacity="0.3"/>
  
  <!-- Central Luxury Monogram "AG" -->
  <g filter="url(#goldGlow)">
    <text x="256" y="325" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="900" font-size="250" fill="url(#goldGradient)" letter-spacing="-6">AG</text>
  </g>
  
  <!-- Decorative Diamond Accent -->
  <polygon points="256,410 264,418 256,426 248,418" fill="#E0B050" opacity="0.9"/>
  <line x1="160" y1="418" x2="236" y2="418" stroke="#E0B050" stroke-width="2" opacity="0.6"/>
  <line x1="276" y1="418" x2="352" y2="418" stroke="#E0B050" stroke-width="2" opacity="0.6"/>
</svg>
