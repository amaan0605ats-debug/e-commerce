<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8922A"/>
      <stop offset="50%" stop-color="#E0B050"/>
      <stop offset="100%" stop-color="#C8922A"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1508"/>
      <stop offset="100%" stop-color="#1E0E05"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="16" y="16" width="480" height="480" rx="52" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.3"/>
  <!-- AG Text -->
  <text x="256" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="220" fill="#FBF3E3" letter-spacing="-8">AG</text>
  <!-- Gold divider line -->
  <rect x="120" y="272" width="272" height="8" rx="4" fill="url(#gold)"/>
  <!-- SUPPLIERS text -->
  <text x="256" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="62" fill="#C8922A" letter-spacing="18">SUPPLIERS</text>
  <!-- Small decorative dots -->
  <circle cx="110" cy="365" r="6" fill="#C8922A" opacity="0.6"/>
  <circle cx="402" cy="365" r="6" fill="#C8922A" opacity="0.6"/>
</svg>
