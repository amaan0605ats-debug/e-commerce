# Render Blueprint (Free Web Service)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: e-commerce-webite
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_1
        sync: false
      # Free MySQL-compatible host (e.g. TiDB Cloud Serverless) — paste connection string in Render dashboard
      - key: MYSQL_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

